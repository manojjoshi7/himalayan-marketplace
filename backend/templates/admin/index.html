{% extends "admin/base.html" %}
{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}">
        Uttarakhand Store Administration
    </a>
</h1>
{% endblock %}

{% block content %}

<div id="content-main">

    <h2>Cache Management</h2>

    <p>
        Clear the configured Django cache when you need
        to refresh cached data.
    </p>

    <form method="post" action="{% url 'admin-clear-cache' %}">
        {% csrf_token %}
        <button type="submit"
                class="button"
                onclick="return confirm('Are you sure you want to clear the cache?');">
            Clear Cache
        </button>
    </form>

    <br>

    {{ block.super }}

</div>

{% endblock %}
