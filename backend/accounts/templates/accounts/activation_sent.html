{% extends "store/base.html" %}

{% block content %}
<div class="container py-5">
    <div class="card shadow-sm mx-auto text-center p-4"
         style="max-width: 550px; border-radius: 16px;">

        <div class="mb-3">
            <i class="bi bi-envelope-check"
               style="font-size: 3rem; color: #198754;"></i>
        </div>

        <h2 class="mb-3">Check Your Email</h2>

        <p class="text-muted">
            Your registration is almost complete.
            We've prepared an activation email for you.
            Click the activation link in the email to activate
            your Uttarakhand Store account.
        </p>

        <a href="{% url 'accounts:login' %}"
           class="btn btn-success mt-3">
            Go to Login
        </a>
    </div>
</div>
{% endblock %}
